<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Surat Sekolah • Sistem Pengurusan Fail & Surat</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 md:p-6 max-w-4xl mx-auto">

  <!-- HEADER RASMI GOVTECH -->
  <header class="bg-gradient-to-r from-blue-950 via-blue-900 to-indigo-900 text-white p-4 rounded-xl shadow-md mb-5 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-white p-2 rounded-lg shadow-inner text-blue-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-base md:text-lg font-bold tracking-wide">e-SURAT SEKOLAH</h1>
        <p class="text-[11px] text-blue-200">Pengurusan Rekod Surat Menyurat & Klasifikasi Fail Rasmi</p>
      </div>
    </div>
    <span id="status-network" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500 shadow-sm flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> ONLINE
    </span>
  </header>

  <!-- MINI-DASHBOARD STATISTIK RINGKAS -->
  <div class="grid grid-cols-3 gap-3 mb-5">
    <div class="bg-white p-3.5 rounded-xl shadow-sm border-l-4 border-blue-600 flex items-center justify-between">
      <div>
        <p class="text-[11px] font-semibold text-slate-500 uppercase">Surat Masuk</p>
        <p id="stat-masuk" class="text-xl md:text-2xl font-bold text-blue-900">0</p>
      </div>
      <div class="bg-blue-50 p-2 rounded-lg text-blue-600 hidden sm:block">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
      </div>
    </div>

    <div class="bg-white p-3.5 rounded-xl shadow-sm border-l-4 border-purple-600 flex items-center justify-between">
      <div>
        <p class="text-[11px] font-semibold text-slate-500 uppercase">Surat Keluar</p>
        <p id="stat-keluar" class="text-xl md:text-2xl font-bold text-purple-900">0</p>
      </div>
      <div class="bg-purple-50 p-2 rounded-lg text-purple-600 hidden sm:block">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
      </div>
    </div>

    <div class="bg-white p-3.5 rounded-xl shadow-sm border-l-4 border-amber-500 flex items-center justify-between">
      <div>
        <p class="text-[11px] font-semibold text-slate-500 uppercase">Belum Sync</p>
        <p id="stat-pending" class="text-xl md:text-2xl font-bold text-amber-600">0</p>
      </div>
      <div class="bg-amber-50 p-2 rounded-lg text-amber-600 hidden sm:block">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      </div>
    </div>
  </div>

  <!-- BORANG DAFTAR SURAT -->
  <form id="borang-surat" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200/80 mb-6 space-y-4">
    <div class="flex items-center gap-2 border-b pb-2.5 text-blue-950">
      <svg class="w-5 h-5 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
      <h2 class="font-bold text-base">Daftar Rekod Surat Baharu</h2>
    </div>

    <!-- Butang Pilihan Kategori Surat -->
    <div>
      <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">1. Pilih Kategori Surat</label>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" id="btn-masuk" onclick="pilihArahSurat('SURAT_MASUK')" class="py-3 px-3 rounded-lg font-bold text-xs md:text-sm border-2 border-blue-700 bg-blue-700 text-white shadow-sm flex items-center justify-center gap-2 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
          SURAT MASUK
        </button>
        <button type="button" id="btn-keluar" onclick="pilihArahSurat('SURAT_KELUAR')" class="py-3 px-3 rounded-lg font-bold text-xs md:text-sm border-2 border-slate-200 bg-slate-50 text-slate-700 flex items-center justify-center gap-2 transition hover:bg-slate-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
          SURAT KELUAR
        </button>
      </div>
      <input type="hidden" id="jenis_rekod" value="SURAT_MASUK">
    </div>

    <!-- Butang Pilihan Klasifikasi Fail -->
    <div>
      <div class="flex justify-between items-center mb-1.5">
        <label class="block text-xs font-bold uppercase text-slate-500">2. Bahagian Klasifikasi Fail</label>
        <button type="button" onclick="bukaModalKod()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-2.5 py-1 rounded-md shadow-sm flex items-center gap-1 transition">
          <span>+ Tambah Kategori / Kod</span>
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
        <button type="button" id="btn-am" onclick="pilihBahagianFail('URUSAN_AM')" class="p-3 rounded-lg font-bold text-xs md:text-sm border-2 border-indigo-700 bg-indigo-700 text-white text-left shadow-sm transition">
          <div class="flex items-center gap-1.5">
            <span>🏢 URUSAN AM (Kod 100 – 500)</span>
          </div>
          <span class="block text-[11px] font-normal opacity-90 mt-0.5">Pentadbiran, Tanah, Aset, Kewangan, Perjawatan</span>
        </button>
        <button type="button" id="btn-fungsian" onclick="pilihBahagianFail('URUSAN_FUNGSIAN')" class="p-3 rounded-lg font-bold text-xs md:text-sm border-2 border-slate-200 bg-slate-50 text-slate-700 text-left transition hover:bg-slate-100">
          <div class="flex items-center gap-1.5">
            <span>🎓 URUSAN FUNGSIAN (Kod 600 – 700+)</span>
          </div>
          <span class="block text-[11px] font-normal opacity-80 mt-0.5">Kurikulum, Kokurikulum, HEM & Operasi Sekolah</span>
        </button>
      </div>
      <input type="hidden" id="bahagian_fail" value="URUSAN_AM">
    </div>

    <!-- Dropdown Kod Fail Spesifik -->
    <div>
      <label class="block text-xs font-bold uppercase text-slate-500 mb-1">3. Kod Fail Spesifik</label>
      <select id="kod_fail" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-50 font-semibold text-sm text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" required></select>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">No. Rujukan Surat</label>
        <input type="text" id="no_rujukan" placeholder="Cth: JPS(W)/SKM/100-1/2" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tarikh Pada Surat</label>
        <input type="date" id="tarikh_surat" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Perkara / Tajuk Surat</label>
      <input type="text" id="perkara" placeholder="Masukkan tajuk penuh surat..." class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Pengirim / Penerima</label>
        <input type="text" id="agensi" placeholder="Cth: PPD Miri / JPNS" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Imbasan Muka Surat 1 (Pilihan)</label>
        <input type="file" id="gambar_surat" accept="image/*" capture="environment" class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-slate-300 rounded-lg p-1">
      </div>
    </div>

    <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-md transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      Semak & Simpan Rekod Surat
    </button>
  </form>
